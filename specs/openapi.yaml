openapi: 3.0.3
info:
  title: Sia Satellite API
  description: |-
    This is the preliminary specification of Sia Satellite API.
  license:
    name: MIT License
    url: https://opensource.org/license/mit/
  version: 1.0.0
servers:
  - url: https://api.ss-alpha.online/v1
tags:
  - name: account
    description: managing user account
  - name: auth
    description: authentication of a user and operations on the user account
  - name: contracts
    description: contract management
  - name: hosts
    description: host management
  - name: objects
    description: object metadata management
  - name: payments
    description: payments and payment history
  - name: satellite
    description: network information
paths:
  /account:
    get:
      tags:
        - account
      description: Retrieve the account status
      security:
        - apiKey: []
        - authCookie: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/plan:
    post:
      tags:
        - account
      description: Change payment plan
      security:
        - apiKey: []
        - authCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                newPlan:
                  description: Desired payment plan
                  type: string
                  example: 'invoicing'
                  enum:
                    - pre-payment
                    - invoicing
      responses:
        '204':
          description: Successful operation
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Payment required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/token:
    get:
      tags:
        - account
      description: Generate an API authentication token
      security:
        - authCookie: []
      parameters:
        - name: duration
          in: query
          description: Duration of the token in seconds
          required: false
          schema:
            type: integer
            format: int64
            default: 604800
            example: 2592000
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    description: API authentication token
                    type: string
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/stats:
    get:
      tags:
        - account
      description: Retrieve usage statistics
      security:
        - apiKey: []
        - authCookie: []
      parameters:
        - name: month
          in: query
          description: Month, defaults to the current month; zero-based
          schema:
            type: integer
            format: int32
            example: 3
        - name: year
          in: query
          description: Year, defaults to the current year
          schema:
            type: integer
            format: int32
            example: 2025
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/settings:
    get:
      tags:
        - account
      description: Retrieve the account settings
      security:
        - apiKey: []
        - authCookie: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - account
      description: Update the account settings
      security:
        - apiKey: []
        - authCookie: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '204':
          description: Successful operation
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth:
    get:
      tags:
        - auth
      description: Log into the dashboard
      security:
        - apiKeyHeader: []
        - authCookie: []
      responses:
        '204':
          description: Successful operation
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      tags:
        - auth
      description: Log into the dashboard using credentials provided
      security: []
      parameters:
        - name: X-Satellite-Password
          in: header
          description: Account password
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  description: Account E-mail address
                  type: string
                  example: 'user@domain.com'
      responses:
        '204':
          description: Successful operation
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login/{provider}:
    post:
      tags:
        - auth
      description: Log into the dashboard using 3rd-party OAuth provider
      security: []
      parameters:
        - name: provider
          in: path
          description: OAuth provider. Only Google is currently supported.
          required: true
          schema:
            type: string
            example: 'google'
        - name: action
          in: query
          description: Reason for the authentication
          required: true
          schema:
            type: string
            enum:
              - login
              - signup
            example: 'login'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [clientId, credential]
              properties:
                clientId:
                  description: Google client ID
                  type: string
                credential:
                  description: Google JWT ID token
                  type: string
      responses:
        '204':
          description: Successful operation
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/signup:
    post:
      tags:
        - auth
      description: Sign up for the Satellite
      security: []
      parameters:
        - name: X-Satellite-Password
          in: header
          description: Account password
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  description: Account E-mail address
                  type: string
                  example: 'user@domain.com'
                code:
                  description: Verification code received by E-mail
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: '123456'
      responses:
        '204':
          description: Successful operation
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/signup/resend:
    post:
      tags:
        - auth
      description: Resend account verification E-mail
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  description: Account E-mail address
                  type: string
                  example: 'user@domain.com'
      responses:
        '204':
          description: Successful operation
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/reset:
    post:
      tags:
        - auth
      description: Reset the account password
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  description: Account E-mail address
                  type: string
                  example: 'user@domain.com'
      responses:
        '204':
          description: Successful operation
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/reset/resend:
    post:
      tags:
        - auth
      description: Resend password reset E-mail
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  description: Account E-mail address
                  type: string
                  example: 'user@domain.com'
      responses:
        '204':
          description: Successful operation
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/change:
    get:
      tags:
        - auth
      description: Change account password
      security:
        - apiKey: []
        - authCookie: []
      parameters:
        - name: X-Satellite-Password
          in: header
          description: New password
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successful operation
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/delete:
    get:
      tags:
        - auth
      description: Delete account
      security:
        - apiKey: []
        - authCookie: []
      responses:
        '204':
          description: Successful operation
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Payment required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /contracts:
    get:
      tags:
        - contracts
      description: Get paginated list of active contracts
      security:
        - apiKey: []
        - authCookie: []
      parameters:
        - name: offset
          in: query
          description: Index of the first contract, starting from 0
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
            example: 0
        - name: limit
          in: query
          description: Maximum number of contracts to return; -1 returns all contracts
          schema:
            type: integer
            format: int32
            default: -1
            example: 100
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contract'
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - contracts
      description: Deletes all contracts
      security:
        - apiKey: []
        - authCookie: []
      responses:
        '204':
          description: Successful operation
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /contract/{id}:
    get:
      tags:
        - contracts
      description: Retrieve contract with the given ID
      security:
        - apiKey: []
        - authCookie: []
      parameters:
        - name: id
          in: path
          description: ID of the contract
          required: true
          schema:
            type: string
            example: '279bfc4fc0dd4bdadfac6b5e50bbc0c23c6dbf6a6bb06a8d4ecfcaddd0cac801'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - contracts
      description: Delete contract with the given ID
      security:
        - apiKey: []
        - authCookie: []
      parameters:
        - name: id
          in: path
          description: ID of the contract
          required: true
          schema:
            type: string
            example: '279bfc4fc0dd4bdadfac6b5e50bbc0c23c6dbf6a6bb06a8d4ecfcaddd0cac801'
      responses:
        '204':
          description: Successful operation
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /contracts/config:
    get:
      tags:
        - contracts
      description: Get the contracts configuration
      security:
        - apiKey: []
        - authCookie: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractsConfig'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - contracts
      description: Update the contracts configuration
      security:
        - apiKey: []
        - authCookie: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractsConfig'
      responses:
        '204':
          description: Successful operation
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /contracts/form:
    post:
      tags:
        - contracts
      description: Form the required number of contracts
      security:
        - apiKey: []
        - authCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [contracts]
              properties:
                contracts:
                  $ref: '#/components/schemas/ContractsConfig'
                hosts:
                  $ref: '#/components/schemas/HostsConfig'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contract'
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /contract/{id}/renew:
    post:
      tags:
        - contracts
      description: Renew the specified contract
      security:
        - apiKey: []
        - authCookie: []
      parameters:
        - name: id
          in: path
          description: ID of the contract
          required: true
          schema:
            type: string
            example: '279bfc4fc0dd4bdadfac6b5e50bbc0c23c6dbf6a6bb06a8d4ecfcaddd0cac801'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [contracts]
              properties:
                newEndHeight:
                  description: End height of the new contract
                  type: integer
                  format: int64
                  example: 533200
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /hosts:
    get:
      tags:
        - hosts
      description: Get paginated list of hosts that satisfy the configuration
      security:
        - apiKey: []
        - authCookie: []
      parameters:
        - name: offset
          in: query
          description: Index of the first host, starting from 0
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
            example: 0
        - name: limit
          in: query
          description: Maximum number of hosts to return; -1 returns all hosts
          schema:
            type: integer
            format: int32
            default: -1
            example: 100
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Host'
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /host/{key}:
    get:
      tags:
        - hosts
      description: Get the host with the given key
      security:
        - apiKey: []
        - authCookie: []
      parameters:
        - name: key
          in: path
          description: Public key of the host
          required: true
          schema:
            type: string
            example: 'ab79a75577b8d906d088be3e82a0e25fa8c7531a1d3218f4e9f4361907ed1cb3'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /hosts/blacklist:
    get:
      tags:
        - hosts
      description: Retrieve the hosts blacklist
      security:
        - apiKey: []
        - authCookie: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: 'ed25519:ab79a75577b8d906d088be3e82a0e25fa8c7531a1d3218f4e9f4361907ed1cb3'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - hosts
      description: Add hosts to the blacklist
      security:
        - apiKey: []
        - authCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                example: 'ab79a75577b8d906d088be3e82a0e25fa8c7531a1d3218f4e9f4361907ed1cb3'
      responses:
        '204':
          description: Successful operation
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - hosts
      description: Clear the hosts blacklist
      security:
        - apiKey: []
        - authCookie: []
      responses:
        '204':
          description: Successful operation
        '400':
          description: Invalid request parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /hosts/blacklist/{key}:
    delete:
      tags:
        - hosts
      description: Remove the host from the blacklist
      security:
        - apiKey: []
        - authCookie: []
      parameters:
